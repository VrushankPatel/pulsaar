name: CI/CD

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Tidy modules
        run: go mod tidy
      - name: Run tests
        run: go test -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v3
        if: env.CODECOV_TOKEN != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.out
          fail_ci_if_error: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  build-binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build binaries
        run: |
          mkdir -p bin
          go build -o bin/agent ./cmd/agent
          go build -o bin/aggregator ./cmd/aggregator
          go build -o bin/cli ./cmd/cli
          go build -o bin/webhook ./cmd/webhook
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  deploy-test:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin/
      - run: chmod +x bin/*
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/
      - name: Install Helm
        run: |
          curl https://get.helm.sh/helm-v3.16.1-linux-amd64.tar.gz -o helm.tar.gz
          tar -zxvf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Create kind cluster
        run: kind create cluster --name pulsaar-test
      - name: Build and load images
        run: |
          docker build -f Dockerfile.agent -t vrushankpatel/pulsaar-agent:latest .
          docker build -f Dockerfile.aggregator -t vrushankpatel/pulsaar-aggregator:latest .
          docker build -f Dockerfile.webhook -t vrushankpatel/pulsaar-webhook:latest .
          kind load docker-image vrushankpatel/pulsaar-agent:latest --name pulsaar-test
          kind load docker-image vrushankpatel/pulsaar-aggregator:latest --name pulsaar-test
          kind load docker-image vrushankpatel/pulsaar-webhook:latest --name pulsaar-test
      - name: Generate TLS certificates for webhook
        run: |
          openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=pulsaar-webhook.default.svc"
          kubectl create secret tls pulsaar-webhook-tls --cert=cert.pem --key=key.pem
      - name: Install Helm chart
        run: |
          helm install pulsaar-test ./charts/pulsaar --set agent.image.tag=latest --set aggregator.image.tag=latest --set webhook.image.tag=latest
      - name: Wait for deployments
        run: kubectl wait --for=condition=available --timeout=300s deployment/pulsaar-test-agent deployment/pulsaar-test-aggregator deployment/pulsaar-test
      - name: Debug Deployment Failure
        if: failure()
        run: |
          echo "=== POD STATUS ==="
          kubectl get pods -n default -o wide
          echo "=== POD DESCRIPTIONS ==="
          kubectl describe pods -n default
          echo "=== EVENTS ==="
          kubectl get events -n default --sort-by='.lastTimestamp'
          echo "=== LOGS: AGENT ==="
          kubectl logs -l app.kubernetes.io/instance=pulsaar-test -c agent -n default --tail=100 || true
          echo "=== LOGS: AGGREGATOR ==="
          kubectl logs -l app.kubernetes.io/instance=pulsaar-test -c aggregator -n default --tail=100 || true
          echo "=== LOGS: WEBHOOK ==="
          kubectl logs -l app.kubernetes.io/instance=pulsaar-test -c webhook -n default --tail=100 || true
      - name: Run deployment test
        run: ./scripts/test_deployment.sh local

  build-images:
    needs: [build-binaries, deploy-test]
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (on tags)
        uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/') && env.DOCKER_USERNAME != ''
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Build and push Docker images
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY=ghcr.io/$OWNER_LC
          
          # Build images locally
          docker build -f Dockerfile.agent -t $REGISTRY/pulsaar-agent:latest .
          docker build -f Dockerfile.aggregator -t $REGISTRY/pulsaar-aggregator:latest .
          docker build -f Dockerfile.cli -t $REGISTRY/pulsaar-cli:latest .
          docker build -f Dockerfile.webhook -t $REGISTRY/pulsaar-webhook:latest .
          
          # Push latest on master branch
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            docker push $REGISTRY/pulsaar-agent:latest
            docker push $REGISTRY/pulsaar-aggregator:latest
            docker push $REGISTRY/pulsaar-cli:latest
            docker push $REGISTRY/pulsaar-webhook:latest
          fi
          
          # Tag and push tags
          if [ -n "$TAG" ]; then
            docker tag $REGISTRY/pulsaar-agent:latest $REGISTRY/pulsaar-agent:$TAG
            docker tag $REGISTRY/pulsaar-aggregator:latest $REGISTRY/pulsaar-aggregator:$TAG
            docker tag $REGISTRY/pulsaar-cli:latest $REGISTRY/pulsaar-cli:$TAG
            docker tag $REGISTRY/pulsaar-webhook:latest $REGISTRY/pulsaar-webhook:$TAG
            
            docker push $REGISTRY/pulsaar-agent:$TAG
            docker push $REGISTRY/pulsaar-aggregator:$TAG
            docker push $REGISTRY/pulsaar-cli:$TAG
            docker push $REGISTRY/pulsaar-webhook:$TAG
            
            # Optionally push to Docker Hub if configured
            if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
              docker tag $REGISTRY/pulsaar-agent:latest vrushankpatel/pulsaar-agent:latest
              docker tag $REGISTRY/pulsaar-agent:latest vrushankpatel/pulsaar-agent:$TAG
              docker tag $REGISTRY/pulsaar-aggregator:latest vrushankpatel/pulsaar-aggregator:latest
              docker tag $REGISTRY/pulsaar-aggregator:latest vrushankpatel/pulsaar-aggregator:$TAG
              docker tag $REGISTRY/pulsaar-cli:latest vrushankpatel/pulsaar-cli:latest
              docker tag $REGISTRY/pulsaar-cli:latest vrushankpatel/pulsaar-cli:$TAG
              docker tag $REGISTRY/pulsaar-webhook:latest vrushankpatel/pulsaar-webhook:latest
              docker tag $REGISTRY/pulsaar-webhook:latest vrushankpatel/pulsaar-webhook:$TAG
              
              docker push vrushankpatel/pulsaar-agent:latest
              docker push vrushankpatel/pulsaar-agent:$TAG
              docker push vrushankpatel/pulsaar-aggregator:latest
              docker push vrushankpatel/pulsaar-aggregator:$TAG
              docker push vrushankpatel/pulsaar-cli:latest
              docker push vrushankpatel/pulsaar-cli:$TAG
              docker push vrushankpatel/pulsaar-webhook:latest
              docker push vrushankpatel/pulsaar-webhook:$TAG
            fi
          fi

  publish-helm-and-pages:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Helm
        run: |
          curl https://get.helm.sh/helm-v3.16.1-linux-amd64.tar.gz -o helm.tar.gz
          tar -zxvf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Package and Index Helm Chart
        run: |
          mkdir -p docs
          helm package charts/pulsaar --destination docs/
          helm repo index docs/ --url https://${{ github.repository_owner }}.github.io/pulsaar
      - name: Commit and Push Helm changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore: publish helm chart and index [skip ci]" || echo "No changes to commit"
          git push origin master || echo "Push failed (already updated)"

  release:
    needs: [test, build-binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Import GPG key
        if: env.GPG_PRIVATE_KEY != ''
        run: echo "$GPG_PRIVATE_KEY" | gpg --import --batch
      - name: Set GPG fingerprint
        if: env.GPG_PRIVATE_KEY != ''
        run: 'echo "GPG_FINGERPRINT=$(gpg --list-keys --with-colons | awk -F: \"/^pub:/ { print \$5; exit }\")" >> $GITHUB_ENV'
      - uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
